name: med-reference

on:
  push:
    branches: [main]
    paths:
      - "med-reference/**"
      - ".github/workflows/med-reference.yml"
  pull_request:
    paths:
      - "med-reference/**"
      - ".github/workflows/med-reference.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: med-reference
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.7"
          python-version: "3.12"
          working-directory: med-reference

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check src

      - name: Check formatting
        run: uv run ruff format --check src

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest
